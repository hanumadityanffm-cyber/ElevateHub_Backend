# ──────────────────────────────────────────────────────────────
# ElevateHub Server — Application Properties
# ──────────────────────────────────────────────────────────────

# Server port
server.port=8080

# ─── MySQL Connection ────────────────────────────────────────
# Make sure MySQL is running on localhost:3306
# The database 'elevatehub_db' must be created manually first
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/elevatehub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Varma@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Logging ────────────────────────────────────────────────
logging.level.com.elevatehub=DEBUG

# ─── CORS — Allowed Frontend Origins ────────────────────────
# Comma-separated list. Override for production deployments.
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
